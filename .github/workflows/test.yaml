name: test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  tests:
    name: end-to-end-test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The server runs in its own network namespace, so the tunnel between the
      # runner and the container is a real one. wireguard-tools is installed only
      # inside the container, leaving the host clean so the action still performs
      # its own install.
      - name: Start WireGuard server container
        run: |
          # The container creates its wireguard link with CAP_NET_ADMIN only, so
          # make sure the host has the module loaded rather than relying on the
          # kernel autoloading it on the container's behalf.
          sudo modprobe wireguard

          docker run -d --name wg-server --cap-add NET_ADMIN \
            alpine:3.22 sleep infinity
          docker exec wg-server apk add --no-cache wireguard-tools-wg iproute2

      - name: Generate keys
        id: keys
        run: |
          server_key=$(docker exec wg-server wg genkey)
          client_key=$(docker exec wg-server wg genkey)
          server_pub=$(printf '%s' "$server_key" | docker exec -i wg-server wg pubkey)
          client_pub=$(printf '%s' "$client_key" | docker exec -i wg-server wg pubkey)

          # Throwaway keys, but keep them out of the log so the output is readable.
          echo "::add-mask::$server_key"
          echo "::add-mask::$client_key"

          {
            echo "server_key=$server_key"
            echo "client_key=$client_key"
            echo "server_pub=$server_pub"
            echo "client_pub=$client_pub"
          } >> "$GITHUB_OUTPUT"

      - name: Configure the server
        run: |
          docker exec wg-server sh -c '
            set -e
            umask 077
            printf "%s\n" "$1" > /etc/wg.key
            ip link add wg0 type wireguard
            wg set wg0 private-key /etc/wg.key listen-port 51820 \
              peer "$2" allowed-ips 10.9.0.2/32
            ip addr add 10.9.0.1/24 dev wg0
            ip link set wg0 up
          ' sh '${{ steps.keys.outputs.server_key }}' '${{ steps.keys.outputs.client_pub }}'

          docker exec wg-server wg show

      # The host can reach container IPs on the default bridge directly, which
      # avoids routing the handshake through docker-proxy.
      - name: Build the client config
        run: |
          server_ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' wg-server)
          echo "Server endpoint: ${server_ip}:51820"

          # AllowedIPs is deliberately narrow. With 0.0.0.0/0 the runner would
          # push all its traffic - including its connection to GitHub - into the
          # tunnel, and the server does not forward, so the job would hang.
          {
            echo 'WG_CLIENT_CONF<<WGEOF'
            echo '[Interface]'
            echo 'PrivateKey = ${{ steps.keys.outputs.client_key }}'
            echo 'Address = 10.9.0.2/32'
            echo ''
            echo '[Peer]'
            echo 'PublicKey = ${{ steps.keys.outputs.server_pub }}'
            echo 'AllowedIPs = 10.9.0.0/24'
            echo "Endpoint = ${server_ip}:51820"
            echo 'PersistentKeepalive = 5'
            echo 'WGEOF'
          } >> "$GITHUB_ENV"

      - name: Connect with the action under test
        uses: ./
        with:
          config: ${{ env.WG_CLIENT_CONF }}

      - name: Assert the interface came up
        run: |
          ip link show wg0
          test "$(stat -c '%a' /etc/wireguard/wg0.conf)" = '600'
          test "$(sudo wg show wg0 public-key)" = '${{ steps.keys.outputs.client_pub }}'
          echo 'interface, config permissions and public key all correct'

      - name: Assert traffic crosses the tunnel
        run: |
          ping -c 3 -W 5 10.9.0.1

          sudo wg show wg0
          handshake=$(sudo wg show wg0 latest-handshakes | awk '{print $2}')
          if [ "${handshake:-0}" -eq 0 ]; then
            echo '::error::no handshake with the server'
            exit 1
          fi

          received=$(sudo wg show wg0 transfer | awk '{print $2}')
          if [ "${received:-0}" -eq 0 ]; then
            echo '::error::nothing was received from the server'
            exit 1
          fi
          echo "handshake completed, ${received} bytes received"

      - name: Show the server side
        if: always()
        run: docker exec wg-server wg show

      - name: Remove the server container
        if: always()
        run: docker rm -f wg-server

